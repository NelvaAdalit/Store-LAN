<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Carrito de Compras - STORE LAN</title>
    <meta name="description" content="Gestiona tu bolsa de compras en STORE LAN.">
    
    <!-- Google Fonts for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Esferas de fondo de la marca -->
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Menú de Navegación Flotante -->
    <header class="navbar-wrapper">
        <nav class="navbar glass-card">
            <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">STORE LAN</div>
            <div style="display: flex; gap: 25px; align-items: center;" class="nav-links-client">
                <a href="index.html" style="color: white; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Inicio</a>
                <a href="tienda.html" style="color: white; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Tienda</a>
                <a href="index.html#contactoSection" style="color: white; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Contacto</a>
            </div>
            <div class="nav-actions">
                <button id="btnOpenAuth" class="btn-outline" style="padding: 10px 18px; font-size: 0.9rem; border-radius: 8px; margin-right: 15px; font-weight: 500; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer;">
                    <i class="fas fa-user-circle" style="margin-right: 5px;"></i> <span id="clientNameNav">Iniciar Sesión</span>
                </button>
                <button id="btnOpenCart" class="btn-cart" onclick="window.location.reload();">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cartCount" class="badge">0</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Contenedor Principal del Carrito (Renderizado Dinámico) -->
    <main id="carritoMainContainer" style="margin-top: 50px; min-height: 60vh;">
        <!-- Se renderizará dinámicamente con app.js -->
        <div class="loading-spinner" style="text-align: center; color: #a0a0a0; padding: 100px;">Cargando tu carrito de compras...</div>
    </main>

    <!-- Botón Flotante de WhatsApp -->
    <a href="https://wa.me/591XXXXXXXXX?text=Hola%20STORE%20LAN,%20quisiera%20consultar%20sobre%20mi%20carrito" class="whatsapp-float" target="_blank" title="Chatear con un asesor">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Modal de Autenticación de Cliente (Login/Registro) -->
    <div id="authModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 450px;">
            <span class="close-modal" id="btnCloseAuthModal">&times;</span>
            
            <!-- Pestañas -->
            <div style="display: flex; gap: 25px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                <h3 id="tabLogin" class="auth-tab active" style="cursor: pointer; color: #e6c27a; font-weight: 600;">Iniciar Sesión</h3>
                <h3 id="tabRegister" class="auth-tab" style="cursor: pointer; color: #a0a0a0; font-weight: 500;">Registrarse</h3>
            </div>

            <!-- Formulario Login -->
            <form id="clientLoginForm">
                <div class="input-group">
                    <label for="loginEmail">Correo Electrónico</label>
                    <input type="email" id="loginEmail" required placeholder="correo@example.com">
                </div>
                <div class="input-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" required placeholder="••••••">
                </div>
                <button type="submit" class="btn-gold" style="width: 100%; border-radius: 8px; padding: 12px; margin-top: 10px;">Entrar</button>
            </form>

            <!-- Formulario Registro -->
            <form id="clientRegisterForm" style="display: none;">
                <div class="input-group">
                    <label for="regNombre">Nombre Completo</label>
                    <input type="text" id="regNombre" required placeholder="Ej. Nelva Adalid">
                </div>
                <div class="input-group">
                    <label for="regEmail">Correo Electrónico</label>
                    <input type="email" id="regEmail" required placeholder="correo@example.com">
                </div>
                <div class="input-group">
                    <label for="regTelf">Teléfono / Celular</label>
                    <input type="text" id="regTelf" placeholder="Ej. 70000000">
                </div>
                <div class="input-group">
                    <label for="regPassword">Contraseña (Mínimo 6 caracteres)</label>
                    <input type="password" id="regPassword" required placeholder="••••••">
                </div>
                <button type="submit" class="btn-gold" style="width: 100%; border-radius: 8px; padding: 12px; margin-top: 10px;">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <!-- Modal de Detalles del Producto (Por si abren las sugerencias y quieren ver detalles) -->
    <div id="productDetailModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 700px; padding: 0; overflow: hidden; border-radius: 20px;">
            <span class="close-modal" id="btnCloseDetailModal" style="top: 20px; right: 25px; z-index: 10;">&times;</span>
            <div style="display: flex; flex-direction: row; flex-wrap: wrap; width: 100%;">
                <!-- Columna Foto -->
                <div style="flex: 1 1 300px; max-height: 400px; overflow: hidden; background: #000;">
                    <img id="detailProductImg" src="" alt="Prenda de vestir" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <!-- Columna Info -->
                <div style="flex: 1 1 300px; padding: 35px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
                    <div>
                        <span id="detailProductCat" style="font-size: 0.75rem; text-transform: uppercase; color: #a0a0a0; letter-spacing: 1.5px; font-weight: 500;">Categoría</span>
                        <h2 id="detailProductName" style="margin: 5px 0 0 0; color: white; font-weight: 400; font-size: 1.6rem; letter-spacing: 1px;">Nombre de la Prenda</h2>
                    </div>
                    
                    <p id="detailProductDesc" style="color: #c0c0c0; font-size: 0.85rem; line-height: 1.6; margin: 0;">Descripción detallada de la prenda...</p>
                    
                    <div style="font-size: 1.5rem; font-weight: 600; color: #e6c27a;" id="detailProductPrice">Bs. 0</div>

                    <!-- Selector de Variantes (Talla y Color) -->
                    <div style="display: flex; flex-direction: column; gap: 15px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 15px;">
                        <div class="input-group" style="margin-bottom: 0;">
                            <label for="detailVariantSelect">Seleccionar Talla / Color</label>
                            <select id="detailVariantSelect" required style="width: 100%; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(212,175,55,0.2); font-family: 'Poppins', sans-serif;">
                                <!-- Cargado dinámicamente -->
                            </select>
                        </div>
                    </div>

                    <!-- Botón Agregar -->
                    <button id="btnDetailAddCart" class="btn-gold" style="width: 100%; border-radius: 10px; padding: 14px; font-weight: bold; margin-top: auto;">
                        <i class="fas fa-shopping-bag" style="margin-right: 8px;"></i> Agregar a la Bolsa
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat en Vivo Profesional (Tawk.to) -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6483bfdecc26a871b021a8d0/1h2hn83ki';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
