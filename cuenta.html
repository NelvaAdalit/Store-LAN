<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - STORE LAN</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .account-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 140px auto 60px auto;
            padding: 0 20px;
        }
        
        .profile-sidebar {
            position: sticky;
            top: 140px;
            height: fit-content;
        }
        
        .profile-card {
            padding: 30px;
            text-align: center;
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e6c27a 0%, #b38f4d 100%);
            color: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 auto 20px auto;
            border: 2px solid rgba(255,255,255,0.1);
        }
        
        .profile-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 600;
            color: white;
            margin-bottom: 5px;
        }
        
        .profile-email {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 20px;
            word-break: break-all;
        }
        
        .profile-info-list {
            text-align: left;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .profile-info-item {
            font-size: 0.85rem;
            color: #d0d0d0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .profile-info-item span {
            color: #a0a0a0;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .profile-info-item strong {
            color: white;
            font-weight: 500;
        }

        .orders-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .orders-header {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            color: white;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .order-card {
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 25px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .order-card:hover {
            border-color: rgba(212, 175, 55, 0.25);
        }
        
        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .order-id {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .order-date {
            font-size: 0.8rem;
            color: #a0a0a0;
        }
        
        .order-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-pendiente {
            background: rgba(255, 183, 3, 0.15);
            color: #ffb703;
            border: 1px solid rgba(255, 183, 3, 0.3);
        }
        
        .status-comprobantesubido {
            background: rgba(0, 180, 216, 0.15);
            color: #00b4d8;
            border: 1px solid rgba(0, 180, 216, 0.3);
        }

        .status-aprobado {
            background: rgba(37, 211, 102, 0.15);
            color: #25d366;
            border: 1px solid rgba(37, 211, 102, 0.3);
        }
        
        .status-cancelado {
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.3);
        }
        
        .order-items-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        
        .order-item-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .order-item-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .order-item-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .order-item-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: white;
        }
        
        .order-item-meta {
            font-size: 0.75rem;
            color: #a0a0a0;
        }
        
        .order-item-price {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e6c27a;
            white-space: nowrap;
        }
        
        .order-card-footer {
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .order-total-label {
            font-size: 0.85rem;
            color: #a0a0a0;
        }
        
        .order-total-val {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #e6c27a;
        }

        .upload-receipt-box {
            background: rgba(0,0,0,0.25);
            border: 1px dashed rgba(212,175,55,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .upload-receipt-box h5 {
            font-family: 'Outfit', sans-serif;
            color: #e6c27a;
            font-size: 0.95rem;
            margin: 0;
            font-weight: 500;
        }

        .upload-receipt-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px 40px;
            border-radius: 16px;
            border: 1px dashed rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.01);
        }

        .empty-state i {
            font-size: 3rem;
            color: rgba(212, 175, 55, 0.3);
            margin-bottom: 20px;
        }

        .empty-state p {
            color: #a0a0a0;
            margin-bottom: 25px;
        }

        /* Responsive Layout */
        @media (max-width: 900px) {
            .account-layout {
                grid-template-columns: 1fr;
                margin-top: 120px;
            }
            .profile-sidebar {
                position: relative;
                top: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Esferas de fondo de la marca -->
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Menú de Navegación Flotante -->
    <header class="navbar-wrapper">
        <nav class="navbar glass-card">
            <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">STORE LAN</div>
            <div style="display: flex; gap: 25px; align-items: center;" class="nav-links-client">
                <a href="index.html" style="color: white; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Inicio</a>
                <a href="tienda.html" style="color: white; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Tienda</a>
                <a href="index.html#contactoSection" style="color: white; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Contacto</a>
            </div>
            <div class="nav-actions">
                <button id="btnOpenAuth" class="btn-outline active" style="padding: 10px 18px; font-size: 0.9rem; border-radius: 8px; margin-right: 15px; font-weight: 600; background: rgba(255,255,255,0.05); border: 1px solid #e6c27a; color: #e6c27a; cursor: pointer;">
                    <i class="fas fa-user-circle" style="margin-right: 5px;"></i> <span id="clientNameNav">Mi Cuenta</span>
                </button>
                <button id="btnOpenCart" class="btn-cart" onclick="window.location.href='carrito.html'">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cartCount" class="badge">0</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Layout Principal -->
    <div class="account-layout">
        
        <!-- Sidebar de Perfil -->
        <aside class="profile-sidebar">
            <div class="profile-card glass-card">
                <div class="profile-avatar" id="profileInitials">-</div>
                <h4 class="profile-name" id="profileName">Cargando...</h4>
                <p class="profile-email" id="profileEmail">correo@example.com</p>
                
                <div class="profile-info-list">
                    <div class="profile-info-item">
                        <span>Teléfono / Celular</span>
                        <strong id="profilePhone">-</strong>
                    </div>
                    <div class="profile-info-item">
                        <span>Miembro desde</span>
                        <strong id="profileJoined">-</strong>
                    </div>
                </div>
                
                <button id="btnLogoutProfile" class="btn-outline" style="width: 100%; border-color: rgba(255,77,77,0.4); color: #ff4d4d; border-radius: 8px; padding: 12px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>
        </aside>
        
        <!-- Listado de Pedidos -->
        <main class="orders-container">
            <div class="orders-header">
                <h3>Historial de Pedidos</h3>
                <span id="ordersCount" style="font-size: 0.95rem; color: #a0a0a0; font-weight: 400;">0 pedidos</span>
            </div>
            
            <div id="ordersList">
                <div style="text-align: center; padding: 40px; color: #a0a0a0;">
                    <i class="fas fa-circle-notch fa-spin" style="font-size: 1.8rem; color: #e6c27a; margin-bottom: 15px;"></i>
                    <p>Cargando tu historial de pedidos...</p>
                </div>
            </div>
        </main>
        
    </div>

    <!-- Botón Flotante de WhatsApp -->
    <a href="https://wa.me/59164725885?text=Hola%20STORE%20LAN,%20tengo%20una%20duda%20sobre%20mi%20pedido" class="whatsapp-float" target="_blank" title="Chatear con un asesor">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Footer -->
    <footer class="social-footer glass-card">
        <p>&copy; 2026 STORE LAN. Todos los derechos reservados.</p>
        <div class="social-links">
            <a href="https://tiktok.com/@storelanbo" target="_blank" title="TikTok - ¡Mira nuestros Lives!" style="color: #ff0050; text-shadow: 0 0 10px rgba(255,0,80,0.5); font-weight: bold; display: inline-flex; align-items: center; gap: 4px; text-decoration: none;"><i class="fab fa-tiktok"></i> <span style="font-size: 0.75rem; text-transform: uppercase; font-family: 'Outfit', sans-serif;">Live</span></a>
            <a href="https://www.instagram.com/storelanbo?igsh=Y3loNWNsZ2VwMTdo" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://chat.whatsapp.com/Iv5vT7wVVwFHHoyYqDEdkL" target="_blank" title="Grupo de WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="cuenta.js"></script>
</body>
</html>
