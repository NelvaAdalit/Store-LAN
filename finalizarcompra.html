<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Finalizar Compra - STORE LAN</title>
    <meta name="description" content="Completa tu pedido y sube tu comprobante de pago en STORE LAN.">
    
    <!-- Google Fonts for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Esferas de fondo de la marca -->
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Menú de Navegación Flotante -->
    <header class="navbar-wrapper">
        <nav class="navbar glass-card">
            <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">STORE LAN</div>
            <div style="display: flex; gap: 25px; align-items: center;" class="nav-links-client">
                <a href="index.html" style="color: white; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Inicio</a>
                <a href="tienda.html" style="color: white; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Tienda</a>
                <a href="index.html#contactoSection" style="color: white; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Contacto</a>
            </div>
            <div class="nav-actions">
                <button id="btnOpenAuth" class="btn-outline" style="padding: 10px 18px; font-size: 0.9rem; border-radius: 8px; margin-right: 15px; font-weight: 500; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer;">
                    <i class="fas fa-user-circle" style="margin-right: 5px;"></i> <span id="clientNameNav">Iniciar Sesión</span>
                </button>
                <button id="btnOpenCart" class="btn-cart" onclick="window.location.href='carrito.html'">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cartCount" class="badge">0</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Contenedor de Checkout (Finalizar Compra) -->
    <main class="store-catalog" style="margin-top: 50px;">
        <div class="catalog-header" style="text-align: center;">
            <h2 style="display: inline-block; border: none; padding: 0; font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; color: #e6c27a; margin-bottom: 30px;">Finalizar Compra</h2>
            <div style="width: 80px; height: 2px; background: #e6c27a; margin: -20px auto 35px auto;"></div>
        </div>

        <form id="checkoutFormPage" class="checkout-layout">
            <!-- Columna Izquierda: Datos de Envío -->
            <div class="checkout-billing glass-card">
                <h3 style="color: #e6c27a; font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 400; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px;">Información de Envío</h3>
                
                <div class="input-group">
                    <label for="checkNombre">Nombre Completo</label>
                    <input type="text" id="checkNombre" required placeholder="Ej. Nelva Adalid" style="width: 100%;">
                </div>

                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <div class="input-group" style="flex: 1 1 200px;">
                        <label for="checkEmail">Correo Electrónico</label>
                        <input type="email" id="checkEmail" required placeholder="correo@example.com" style="width: 100%;">
                    </div>
                    <div class="input-group" style="flex: 1 1 200px;">
                        <label for="checkTelf">Celular / Teléfono</label>
                        <input type="text" id="checkTelf" required placeholder="Ej. 70000000" style="width: 100%;">
                    </div>
                </div>

                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <div class="input-group" style="flex: 2 1 250px;">
                        <label for="checkDireccion">Dirección Completa (Calle, Nro., Zona)</label>
                        <input type="text" id="checkDireccion" required placeholder="Ej. Av. Hernando Siles Nro. 450, Z. Central" style="width: 100%;">
                    </div>
                    <div class="input-group" style="flex: 1 1 150px;">
                        <label for="checkCiudad">Ciudad / Departamento</label>
                        <input type="text" id="checkCiudad" required placeholder="Ej. Sucre" style="width: 100%;">
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Pago QR y Confirmación -->
            <div class="checkout-payment glass-card" style="display: flex; flex-direction: column;">
                <h3 style="color: #e6c27a; font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 400; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px;">Resumen del Pedido</h3>
                
                <!-- Items list summary -->
                <div id="checkoutSummaryItems" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; max-height: 200px; overflow-y: auto; padding-right: 5px;">
                    <!-- Se cargan dinámicamente -->
                </div>

                <!-- Totales del Checkout -->
                <div style="border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 15px; margin-bottom: 25px;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #a0a0a0; margin-bottom: 8px;">
                        <span>Envío:</span>
                        <span style="color: #25d366; font-weight: bold; text-transform: uppercase;">Gratis</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: bold; color: white;">
                        <span>Total estimado:</span>
                        <span id="checkoutTotalSumPage" style="color: #e6c27a;">Bs. 0</span>
                    </div>
                </div>

                <!-- Sección QR de Pago -->
                <h3 style="color: #e6c27a; font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 400; margin-bottom: 20px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 15px;">Pagar con QR</h3>
                <p style="font-size: 0.8rem; color: #a0a0a0; line-height: 1.5; margin-bottom: 15px; text-align: center;">
                    Escanea el código QR de pago oficial de la tienda, realiza la transferencia y sube tu comprobante.
                </p>

                <div style="text-align: center; margin-bottom: 20px;">
                    <img id="checkoutQrImgPage" src="" alt="Cargando QR oficial..." style="max-width: 180px; border-radius: 8px; border: 2px solid rgba(212,175,55,0.3); padding: 5px; background: white;">
                </div>

                <div class="input-group">
                    <label for="comprobanteFilePage">Subir Captura del Comprobante (Imagen)</label>
                    <input type="file" id="comprobanteFilePage" accept="image/*" required style="width: 100%;">
                </div>

                <button type="submit" class="btn-gold" style="width: 100%; border-radius: 8px; padding: 14px; font-weight: bold; font-size: 1rem; margin-top: auto;">
                    Confirmar Pedido y Enviar Pago
                </button>
            </div>
        </form>
    </main>

    <!-- Botón Flotante de WhatsApp -->
    <a href="https://wa.me/591XXXXXXXXX?text=Hola%20STORE%20LAN,%20tengo%20una%20consulta%20sobre%20mi%20pago" class="whatsapp-float" target="_blank" title="Chatear con un asesor">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Footer -->
    <footer class="social-footer glass-card" style="margin-top: 60px;">
        <p>&copy; 2026 STORE LAN. Todos los derechos reservados.</p>
        <div class="social-links">
            <a href="#" title="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" title="Facebook"><i class="fab fa-facebook"></i></a>
        </div>
    </footer>

    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();

    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];

    })();
    </script>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
